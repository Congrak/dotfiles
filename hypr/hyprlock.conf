#  Created by Congrak - Rodrigo Celis
# ═══════════════════════════════════════════════════════════════════════

general {
    # The session buttons are clickable, so the pointer has to exist.
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

# ── Background ─────────────────────────────────────────────────────────
background {
    monitor =
    color = rgba(0b0b0bff)
    # The desktop background, heavily darkened and blurred
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.85
    brightness = 0.18
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ── Clock ──────────────────────────────────────────────────────────────
# One reading, big. The seconds used to sit under it in Ndot at half the
# size, which read as a second clock rather than a detail.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 164
    font_family = Ndot77JPExtended
    position = 0, 150
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────────────────────
# Tracked uppercase mono, the label voice used everywhere in the shell,
# rather than the sentence-case Inter it had.
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_GB.UTF-8 date +"%A %-d %B" | tr 'a-z' 'A-Z' | sed 's/\(.\)/\1 /g; s/ *$//'
    color = rgba(8a8a8aff)
    font_size = 11
    font_family = JetBrainsMono NF
    position = 0, 52
    halign = center
    valign = center
}

# ── The red dot, Nothing's signature ───────────────────────────────────
shape {
    monitor =
    size = 7, 7
    color = rgba(d71921ff)
    rounding = 4
    position = 0, 14
    halign = center
    valign = center
}

# ── Input field ────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 292, 46
    outline_thickness = 1
    dots_size = 0.30
    dots_spacing = 0.34
    dots_center = true
    # Squares rather than the generic round bullet: closer to the Glyph
    # Matrix pitch, and bigger so each keystroke reads as a mark.
    # dots_rounding = -1 gives the round dots back.
    dots_rounding = 2

    # hyprlock can also draw a character per keystroke instead of a
    # shape. Left commented because I could not test it here and unparsed
    # markup would show as literal text:
    # dots_text_format = *

    outer_color = rgba(2a2a2aff)
    inner_color = rgba(161616ff)
    font_color = rgba(ffffffff)
    check_color = rgba(d71921ff)
    fail_color = rgba(d71921ff)

    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##454545">Password</span>
    fail_text = <span foreground="##d71921">$FAIL  ·  $ATTEMPTS</span>
    hide_input = false

    position = 0, -56
    halign = center
    valign = center
}

# ── User ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(696969ff)
    font_size = 10
    font_family = JetBrainsMono NF
    position = 0, -100
    halign = center
    valign = center
}


